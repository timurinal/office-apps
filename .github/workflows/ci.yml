name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Chromium for the walk
        run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/web
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: dist/e2e
          retention-days: 7

  shell:
    runs-on: ubuntu-24.04
    needs: web
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt WebEngine's libraries and a display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libgbm1 libasound2t64 libnss3 xvfb
      - run: pip install -r shell/requirements-dev.txt
      - name: Unit tests
        working-directory: shell
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q
      - name: Self-test
        working-directory: shell
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" python -m officeapps --self-test \
            --web-dir ../dist/web --fixtures ../tests/corpus \
            --data-dir "$RUNNER_TEMP/selftest" --report "$RUNNER_TEMP/selftest/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-linux
          path: ${{ runner.temp }}/selftest/out
          retention-days: 7
